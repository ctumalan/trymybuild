<svg xmlns="http://www.w3.org/2000/svg" width="600" height="112" viewBox="0 0 600 112" role="img" aria-labelledby="title desc"><title id="title">Invite, learn, improve</title><desc id="desc">Invite friends or early users, learn where they get stuck, then use the conversation to improve your app.</desc><style>
.step { animation:appear .4s ease-out both; }
.step-one { animation-delay:.15s; }
.step-two { animation-delay:1.1s; }
.step-three { animation-delay:2.1s; }
.arrow { stroke-dasharray:1; stroke-dashoffset:1; animation:draw .5s ease-out forwards; }
.arrow-one { animation-delay:.6s; }
.arrow-two { animation-delay:1.6s; }
.arrowhead { animation:appear .15s ease-out both; }
.head-one { animation-delay:1s; }
.head-two { animation-delay:2s; }
@keyframes appear { from { opacity:0; } to { opacity:1; } }
@keyframes draw { to { stroke-dashoffset:0; } }
@media(prefers-reduced-motion:reduce) { .step,.arrowhead { animation:none; opacity:1; } .arrow { animation:none; stroke-dashoffset:0; } }
