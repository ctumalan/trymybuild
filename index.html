<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Share apps you’ve built. Try apps others are building. Showcase your app, invite people to try it, and collect feedback on TryMyBuild." />
    <title>TryMyBuild — Share your app. Discover apps to try.</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/trymybuild-favicon.svg" />
    <link rel="stylesheet" href="launch-refinements.css" /><link rel="stylesheet" href="ui-refinements.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/trymybuild-app-180.png" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <header class="site-header">
      <button class="brand" type="button" data-route="discover" aria-label="TryMyBuild catalog">
        <img class="brand-mark" src="assets/brand/trymybuild-mark.svg" width="40" height="40" alt="" />
        <span class="brand-name">TryMy<span class="brand-name-works">Build</span></span>
        <span class="brand-promise">Discover apps. Share what you’ve built.</span>
      </button>
      <nav class="site-nav account-only-nav" aria-label="User menu">
        <button class="profile-button" data-route="account" aria-label="My TryMyBuild">T</button>
      </nav>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <button class="footer-brand" data-route="discover"><img class="brand-mark" src="assets/brand/trymybuild-mark.svg" width="40" height="40" alt="" /><span>TryMy<span class="brand-name-works">Build</span></span></button>
      <div><a href="/?page=about" data-route="about">About</a><a href="/?page=contact" data-route="contact">Contact</a><a href="/terms">Terms</a><a href="/privacy">Privacy</a></div>
      <details data-guest-discovery><summary>Discovery preferences</summary><label><input type="checkbox" data-guest-personalization checked> Personalize suggestions using categories I visit in this browser</label><button type="button" data-guest-reset>Clear category history</button><p data-guest-status role="status"></p></details>
    </footer>

    <script src="preview-utils.js"></script>
    <script src="listing-rules.js"></script><script src="share-invitation.js" defer></script><script src="project-media.js"></script><script src="notification-bell.js" defer></script><script src="account-nav.js" defer></script>
  <script src="pricing.js"></script><script src="workspace-ui.js"></script><script src="community-entry.js"></script><script src="app.js"></script>
  <script src="interaction-polish.js" defer></script><script src="analytics.js" defer></script></body>
</html>
