    <form data-activity-form>
      <label class="field"><span>Child</span>
        <select name="childId" data-fk="form:childId">${optionList(view.plan.children, draft.childId, "Choose a child")}</select>
      </label>
      <label class="field"><span>Or add a new child<small>Leave empty to use the list above.</small></span>
        <input type="text" name="newChild" maxlength="60" placeholder="Nickname" data-fk="form:newChild" />
      </label>
      <label class="field"><span>What is it?</span>
        <input type="text" name="name" maxlength="60" required placeholder="Swim practice" value="${esc(draft.name)}" data-fk="form:name" />
      </label>
      <label class="field"><span>Where?</span>
        <select name="venueId" data-fk="form:venueId">${optionList(view.plan.venues, draft.venueId, "Choose a place")}</select>
      </label>
      <label class="field"><span>Or add a new place<small>A nickname, not an address.</small></span>
        <input type="text" name="newVenue" maxlength="60" placeholder="Riverside Pool" data-fk="form:newVenue" />
      </label>
      <label class="field"><span>Which day?</span>
        <select name="day" data-fk="form:day">${DAYS.map(day => `<option value="${day.id}" ${day.id === draft.day ? "selected" : ""}>${day.label}</option>`).join("")}</select>
      </label>
      <div class="field-pair">
        <label class="field"><span>Starts</span><input type="time" name="start" required value="${esc(draft.start)}" data-fk="form:start" /></label>
        <label class="field"><span>Ends</span><input type="time" name="end" required value="${esc(draft.end)}" data-fk="form:end" /></label>
      </div>
      <label class="check-field">
        <input type="checkbox" name="adultStays" ${draft.adultStays ? "checked" : ""} data-fk="form:adultStays" />
        <span><b>An adult has to stay for the whole session</b><small>The person dropping off will stay until the activity ends, so they cannot cover another ride during that time.</small></span>
      </label>
      <div class="field-pair">
        <label class="field"><span>Drop-off</span><select name="dropoffCaregiverId" data-fk="form:dropoff">${optionList(view.plan.caregivers, draft.dropoffCaregiverId, "Nobody yet")}</select></label>
        <label class="field"><span>Pickup<small>If an adult stays, choose them here or the person taking over.</small></span><select name="pickupCaregiverId" data-fk="form:pickup">${optionList(view.plan.caregivers, draft.pickupCaregiverId, "Nobody yet")}</select></label>
      </div>
      ${view.plan.caregivers.length ? "" : `<p class="choices-none">Nobody is on your list yet. Save this, then add the people who drive under “People, places and travel times”.</p>`}
      <div class="dialog-actions">
        ${editing ? `<button type="button" class="btn btn-danger btn-small spacer" ${act("ask-delete-activity", editing.id)}>${icon("trash")} Remove</button>` : ""}
        <button type="button" class="btn btn-quiet" ${act("close-dialog")}>Cancel</button>
        <button type="submit" class="btn btn-primary">${editing ? "Save changes" : "Add it"}</button>
      </div>
    </form>
  </div></dialog>`;
}

function dayPlanDialog() {
  const text = dailyDriverPlanText(view.plan, view.analysis, view.dialog.dayId);
  return `<dialog aria-labelledby="plan-dialog-title"><div class="dialog-inner">
    <div class="dialog-head">
      <div><h2 id="plan-dialog-title">${esc(dayLabel(view.dialog.dayId))} driver plan</h2><p>Copy it into a message, or print it for the fridge.</p></div>
      <button type="button" class="dialog-close" ${act("close-dialog")} aria-label="Close">${icon("close")}</button>
    </div>
    <label class="visually-hidden" for="plan-text">Daily driver plan text</label>
    <textarea class="plan-text" id="plan-text" readonly data-plan-text data-fk="plan-text">${esc(text)}</textarea>
    <div class="dialog-actions">
      <button type="button" class="btn btn-quiet spacer" ${act("print-day-plan")}>${icon("printer")} Print</button>
      <button type="button" class="btn btn-quiet" ${act("close-dialog")}>Close</button>
      <button type="button" class="btn btn-primary" ${act("copy-day-plan")}>${icon("copy")} Copy</button>
    </div>
  </div></dialog>`;
}

function confirmDialog() {
  const { title, body, confirmLabel } = view.dialog;
  return `<dialog aria-labelledby="confirm-dialog-title"><div class="dialog-inner">
    <div class="dialog-head">
      <div><h2 id="confirm-dialog-title">${esc(title)}</h2></div>
      <button type="button" class="dialog-close" ${act("close-dialog")} aria-label="Close">${icon("close")}</button>
    </div>
    <p>${esc(body)}</p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-quiet" ${act("close-dialog")}>Keep it</button>
      <button type="button" class="btn btn-danger" ${act("confirm-yes")} data-fk="confirm-yes">${esc(confirmLabel)}</button>
    </div>
  </div></dialog>`;
}

function dialogHtml() {
  if (!view.dialog) return "";
  if (view.dialog.type === "activity") return activityDialog();
  if (view.dialog.type === "dayplan") return dayPlanDialog();
  if (view.dialog.type === "confirm") return confirmDialog();
  return "";
}

function toastHtml() {
  if (!view.toast) return "";
  const tone = view.toast.tone === "error" ? "is-error" : view.toast.tone === "good" ? "is-good" : "";
  const glyph = view.toast.tone === "error" ? "alert" : view.toast.tone === "good" ? "check" : "info";
  return `<div class="toast-anchor"><div class="toast ${tone}">
    ${icon(glyph)}<span>${esc(view.toast.message)}</span>
    ${view.toast.withUndo && view.undo ? `<button type="button" ${act("undo")}>${icon("undo")} Undo</button>` : ""}
    <button type="button" ${act("dismiss-toast")} aria-label="Dismiss message">${icon("close")}</button>
  </div></div>`;
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------

function captureFocus() {
  const el = document.activeElement;
  const fk = el && el.getAttribute ? el.getAttribute("data-fk") : null;
  if (!fk) return null;
  const snap = { fk, start: null, end: null };
  try {
    snap.start = el.selectionStart;
    snap.end = el.selectionEnd;
  } catch {
    // Selection is not readable on every input type; focus alone is enough.
  }
  return snap;
}

function restoreFocus(previous) {
  const key = view.pendingFocus || previous?.fk;
  view.pendingFocus = null;
  if (!key) return;
  const target = root.querySelector(`[data-fk="${CSS.escape(key)}"]`);
  if (!target) return;
  target.focus({ preventScroll: true });
  if (previous && previous.fk === key && previous.start != null && target.setSelectionRange) {
    try {
      target.setSelectionRange(previous.start, previous.end);
    } catch {
      // Not every input supports selection ranges.
    }
  }
}

function render() {
  const previous = captureFocus();
  view.analysis = analyzePlan(view.plan);
  root.innerHTML = `${masthead()}
    <main class="shell" id="main" tabindex="-1">
      ${noticesHtml()}
      ${daybar()}
      <div class="columns">
        <div>${agendaPanel()}</div>
        <div>${decisionsPanel()}${dataPanel()}</div>
      </div>
      ${setupSection()}
    </main>
    <footer class="colophon"><div class="colophon-inner">
      <p><strong>AfterSchool Together</strong> — a small tool by the TryMyBuild team.</p>
      <p>Your family plan stays in this browser. No account, automatic sharing or live traffic.</p>
    </div></footer>
    <div class="print-sheet"><pre>${esc(dailyDriverPlanText(view.plan, view.analysis, view.dayId))}</pre></div>
    ${dialogHtml()}
    ${toastHtml()}`;

  const dialog = root.querySelector("dialog");
  if (dialog && !dialog.open) {
    dialog.showModal();
    dialog.addEventListener("close", () => {
      if (view.dialog) {
        view.dialog = null;
        render();
      }
    });
  }
  restoreFocus(previous);
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------

function closeDialog() {
  view.dialog = null;
  render();
}

function askConfirm(config) {
  view.dialog = { type: "confirm", ...config };
  render();
}

function removeEntity(kind, id) {
  const plan = JSON.parse(JSON.stringify(view.plan));
  if (kind === "child") {
    plan.children = plan.children.filter(item => item.id !== id);
    plan.activities = plan.activities.filter(item => item.childId !== id);
  } else if (kind === "venue") {
    plan.venues = plan.venues.filter(item => item.id !== id);
    plan.activities = plan.activities.filter(item => item.venueId !== id);
    plan.routes = plan.routes.filter(item => item.fromVenueId !== id && item.toVenueId !== id);
  } else {
    plan.caregivers = plan.caregivers.filter(item => item.id !== id);
    for (const activity of plan.activities) {
      if (activity.dropoffCaregiverId === id) activity.dropoffCaregiverId = null;
      if (activity.pickupCaregiverId === id) activity.pickupCaregiverId = null;
    }
  }
  snapshot("remove");
  commit(plan);
  toast(kind === "caregiver" ? "Removed. Their rides now need someone else." : "Removed, along with the activities and travel times linked to it.", "info", true);
  render();
}

function askRemoveEntity(kind, id) {
  const list = kind === "child" ? view.plan.children : kind === "venue" ? view.plan.venues : view.plan.caregivers;
  const entity = findById(list, id);
  if (!entity) return;
  const affected =
    kind === "child"
      ? view.plan.activities.filter(item => item.childId === id).length
      : kind === "venue"
        ? view.plan.activities.filter(item => item.venueId === id).length
        : view.plan.activities.filter(item => item.dropoffCaregiverId === id || item.pickupCaregiverId === id).length;
  if (!affected) {
    removeEntity(kind, id);
    return;
  }
  askConfirm({
    title: `Remove ${entity.name}?`,
    body:
      kind === "caregiver"
        ? `${entity.name} is named on ${affected} ${affected === 1 ? "activity" : "activities"}. Removing them leaves those trips with nobody assigned. Nothing else is deleted.`
        : `${affected} ${affected === 1 ? "activity uses" : "activities use"} this. Removing it removes ${affected === 1 ? "that activity" : "those activities"} too.`,
    confirmLabel: `Remove ${entity.name}`,
    action: { name: `remove-${kind}`, id },
  });
}

function saveActivityForm(form) {
  const data = new FormData(form);
  const plan = JSON.parse(JSON.stringify(view.plan));

  const newChild = String(data.get("newChild") || "").trim();
  let childId = String(data.get("childId") || "");
  if (newChild) {
    childId = makeId("child");
    plan.children.push({ id: childId, name: newChild.slice(0, 60), color: CHILD_COLORS[plan.children.length % CHILD_COLORS.length].id });
  }
  if (!childId) {
    view.dialog.error = "Choose a child, or type a nickname in “Or add a new child”.";
    render();
    return;
  }

  const newVenue = String(data.get("newVenue") || "").trim();
  let venueId = String(data.get("venueId") || "");
  if (newVenue) {
    venueId = makeId("venue");
    plan.venues.push({ id: venueId, name: newVenue.slice(0, 60) });
  }
  if (!venueId) {
    view.dialog.error = "Choose a place, or type one in “Or add a new place”.";
    render();
    return;
  }

  const name = String(data.get("name") || "").trim();
  if (!name) {
    view.dialog.error = "Give it a name you will recognize, like swimming or piano.";
    render();
    return;
  }

  const start = String(data.get("start") || "");
  const end = String(data.get("end") || "");
  if (parseTime(start) === null || parseTime(end) === null) {
    view.dialog.error = "Add a valid start time and end time so we can check the rides.";
    render();
    return;
  }
  if (parseTime(end) <= parseTime(start)) {
    view.dialog.error = "The end time has to be after the start time.";
    render();
    return;
  }

  const record = {
    id: view.dialog.activityId || makeId("act"),
    childId,
    name: name.slice(0, 60),
    venueId,
    day: String(data.get("day") || view.dayId),
    start,
    end,
    dropoffCaregiverId: String(data.get("dropoffCaregiverId") || "") || null,
    pickupCaregiverId: String(data.get("pickupCaregiverId") || "") || null,
    adultStays: data.get("adultStays") === "on",
  };

  const index = plan.activities.findIndex(item => item.id === record.id);
  if (index >= 0) plan.activities[index] = record;
  else plan.activities.push(record);

  snapshot("activity");
  view.dialog = null;
  view.dayId = record.day;
  commit(plan);
  toast(index >= 0 ? "Saved. Take a look at how the rides fit now." : "Added. Let’s see how the afternoon fits together.", "good", true);
  render();
}

function applySuggestion(conflictId, tripKey, caregiverId) {
  const conflict = view.analysis.conflicts.find(item => item.id === conflictId);
  const trip = view.analysis.obligations.find(item => item.key === tripKey);
  if (!conflict || !trip) {
    toast("That option is no longer available because the plan has changed.", "error");
    render();
    return;
  }
  snapshot("suggestion");
  const next = reassignTrip(view.plan, trip, caregiverId);
  commit(next);
  toast(`${caregiverName(view.plan, caregiverId)} is now down for that trip in your plan. Nobody has been contacted.`, "good", true);
  render();
}

function copyText(text, okMessage) {
  const finish = ok => {
    toast(ok ? okMessage : "The copy button did not work in this browser. You can still select the plan and copy it yourself.", ok ? "good" : "error");
    render();
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => finish(true), () => finish(legacyCopy(text)));
    return;
  }
  finish(legacyCopy(text));
}

function legacyCopy(text) {
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  let ok = false;
  try {
    ok = document.execCommand("copy");
  } catch {
    ok = false;
  }
  area.remove();
  return ok;
}

function exportBackup() {
  const payload = JSON.stringify(buildBackup(view.plan, new Date().toISOString()), null, 2);
  try {
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `afterschool-together-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Backup saved to your downloads. Send it yourself to share this plan.", "good");
  } catch {
    copyText(payload, "This browser would not download a file, so the backup was copied to your clipboard instead.");
    return;
  }
  render();
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onerror = () => {
    toast("That file could not be read, so nothing was changed.", "error");
    render();
  };
  reader.onload = () => {
    const result = readBackup(String(reader.result || ""));
    if (!result.ok) {
      toast(result.errors[0], "error");
      render();
      return;
    }
    snapshot("import");
    commit(result.plan, { keepExample: true });
    view.dayId = firstUsefulDay(result.plan);
    if (result.errors.length) {
      view.notices = [{ id: makeId("notice"), tag: "Opened with repairs", tone: "alert", message: `${result.errors.length} ${result.errors.length === 1 ? "part" : "parts"} of that file could not be used: ${result.errors.join(" ")}` }];
      toast("Backup opened, but some of it had to be skipped. See the note at the top.", "error", true);
    } else {
      toast("Backup opened. Your previous plan can still be restored with Undo.", "good", true);
    }
    render();
  };
  reader.readAsText(file);
}

function firstUsefulDay(plan) {
  const today = DAYS[(new Date().getDay() + 6) % 7].id;
  const has = dayId => plan.activities.some(item => item.day === dayId);
  if (has(today)) return today;
  return DAYS.find(day => has(day.id))?.id || today;
}

function updateRoute(input) {
  const from = input.dataset.routeFrom;
  const to = input.dataset.routeTo;
  const raw = input.value.trim();
  const plan = JSON.parse(JSON.stringify(view.plan));
  plan.routes = plan.routes.filter(
    item => !((item.fromVenueId === from && item.toVenueId === to) || (item.fromVenueId === to && item.toVenueId === from)),
  );
  if (raw === "") {
    commit(plan);
    toast("Cleared. That pair is an estimate again, and it is marked wherever it matters.", "info");
    render();
    return;
  }
  const minutes = parseMinutesInput(raw);
  if (minutes === null) {
    toast("Travel time has to be a whole number of minutes, and cannot be negative.", "error");
    render();
    return;
  }
  plan.routes.push({ id: makeId("route"), fromVenueId: from, toVenueId: to, minutes });
  commit(plan);
}

function updateSetting(input) {
  const key = input.dataset.setting;
  const minutes = parseMinutesInput(input.value);
  if (minutes === null) {
    toast("That has to be a whole number of minutes, and cannot be negative.", "error");
    render();
    return;
  }
  commit({ ...view.plan, settings: { ...view.plan.settings, [key]: minutes } });
}

const CONFIRMED = {
  "clear-all": () => {
    snapshot("clear");
    commit(emptyPlan());
    view.setupOpen = true;
    toast("Cleared. Undo will bring it back if that was a mistake.", "info", true);
    render();
  },
  "delete-activity": id => {
    snapshot("delete");
    commit({ ...view.plan, activities: view.plan.activities.filter(item => item.id !== id) });
    toast("Removed. Undo will bring it back.", "info", true);
    render();
  },
  "remove-child": id => removeEntity("child", id),
  "remove-venue": id => removeEntity("venue", id),
  "remove-caregiver": id => removeEntity("caregiver", id),
};

const ACTIONS = {
  "select-day": id => {
    view.dayId = id;
    render();
  },
  "add-activity": () => {
    view.dialog = { type: "activity", activityId: null, error: null };
    render();
  },
  "edit-activity": id => {
    view.dialog = { type: "activity", activityId: id, error: null };
    render();
  },
  "ask-delete-activity": id => {
    const activity = findById(view.plan.activities, id);
    if (!activity) return;
    askConfirm({
      title: `Remove “${activity.name}”?`,
      body: `This removes ${activity.name} on ${dayLabel(activity.day)} and the trips that go with it. You can undo it straight afterwards.`,
      confirmLabel: "Remove it",
      action: { name: "delete-activity", id },
    });
  },
  "toggle-setup": () => {
    view.setupOpen = !view.setupOpen;
    render();
  },
  "open-setup": () => {
    view.setupOpen = true;
    view.dialog = null;
    render();
    document.getElementById("setup-body")?.scrollIntoView({ behavior: "smooth", block: "start" });
  },
  "remove-child": id => askRemoveEntity("child", id),
  "remove-caregiver": id => askRemoveEntity("caregiver", id),
  "remove-venue": id => askRemoveEntity("venue", id),
  "close-dialog": closeDialog,
  "confirm-yes": () => {
    const action = view.dialog?.action;
    view.dialog = null;
    if (action && CONFIRMED[action.name]) CONFIRMED[action.name](action.id);
    else render();
  },
  "clear-all": () => {
    askConfirm({
      title: "Clear everything?",
      body: "This removes every child, caregiver, place, travel time and activity from this browser. Save a backup first if you might want it back later. Undo is available immediately afterwards.",
      confirmLabel: "Clear everything",
      action: { name: "clear-all" },
    });
  },
  "load-example": () => {
    snapshot("example");
    commit(examplePlan(), { keepExample: true });
    view.dayId = "mon";
    toast("Example week loaded. It is clearly labelled and yours to edit.", "info", true);
    render();
  },
  "show-day-plan": () => {
    view.dialog = { type: "dayplan", dayId: view.dayId };
    render();
  },
  "copy-day-plan": () => {
    copyText(dailyDriverPlanText(view.plan, view.analysis, view.dialog.dayId), "Copied. Paste it into a message.");
  },
  "print-day-plan": () => {
    window.print();
  },
  "export-download": exportBackup,
  "import-open": () => {
    root.querySelector("[data-import-input]")?.click();
  },
  undo: () => {
    if (!view.undo) return;
    const restored = view.undo.plan;
    view.undo = null;
    commit(restored, { keepExample: true });
    toast("Put back the way it was.", "info");
    render();
  },
  "dismiss-toast": () => {
    view.toast = null;
    render();
  },
  "dismiss-notice": id => {
    view.notices = view.notices.filter(item => item.id !== id);
    render();
  },
};

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

root.addEventListener("click", event => {
  const suggestion = event.target.closest("[data-act='apply-suggestion']");
  if (suggestion) {
    view.pendingFocus = null;
    applySuggestion(suggestion.dataset.conflict, suggestion.dataset.trip, suggestion.dataset.caregiver);
    return;
  }
  const trigger = event.target.closest("[data-act]");
  if (!trigger) return;
  const handler = ACTIONS[trigger.dataset.act];
  if (!handler) return;
  event.preventDefault();
  view.pendingFocus = trigger.getAttribute("data-fk");
  handler(trigger.dataset.id);
});

root.addEventListener("submit", event => {
  const activityForm = event.target.closest("[data-activity-form]");
  if (activityForm) {
    event.preventDefault();
    saveActivityForm(activityForm);
    return;
  }
  const addForm = event.target.closest("[data-add]");
  if (!addForm) return;
  event.preventDefault();
  const kind = addForm.dataset.add;
  const input = addForm.querySelector("input[name='name']");
  const name = input.value.trim().replace(/\s+/g, " ").slice(0, 60);
  if (!name) {
    toast("Type a name first.", "error");
    render();
    return;
  }
  const plan = JSON.parse(JSON.stringify(view.plan));
  if (kind === "child") plan.children.push({ id: makeId("child"), name, color: CHILD_COLORS[plan.children.length % CHILD_COLORS.length].id });
  if (kind === "caregiver") plan.caregivers.push({ id: makeId("care"), name });
  if (kind === "venue") plan.venues.push({ id: makeId("venue"), name });
  view.pendingFocus = `add-${kind}`;
  commit(plan);
});

root.addEventListener("change", event => {
  if (event.target.matches("[data-route-from]")) {
    view.pendingFocus = event.target.getAttribute("data-fk");
    updateRoute(event.target);
    return;
  }
  if (event.target.matches("[data-setting]")) {
    view.pendingFocus = event.target.getAttribute("data-fk");
    updateSetting(event.target);
    return;
  }
  if (event.target.matches("[data-import-input]")) {
    const file = event.target.files?.[0];
    event.target.value = "";
    if (file) importBackup(file);
  }
});

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------

const startup = loadPlan(storage);
view.plan = startup.plan;
view.dayId = firstUsefulDay(startup.plan);
if (startup.status === "recovered") {
  keepUnreadable(storage, startup.rescued);
  view.notices = [{ id: makeId("notice"), tag: "Saved plan could not be read", tone: "alert", message: `${startup.errors.join(" ")} The unreadable copy is still in this browser under "${"afterschool-together.unreadable-backup.v1"}" in case it can be rescued.` }];
} else if (startup.status === "unavailable") {
  view.notices = [{ id: makeId("notice"), tag: "Not saving", tone: "alert", message: startup.errors[0] }];
} else if (startup.errors.length) {
  view.notices = [{ id: makeId("notice"), tag: "Opened with repairs", tone: "alert", message: startup.errors.join(" ") }];
}

render();
})();
    </script>
  </body>
</html>
