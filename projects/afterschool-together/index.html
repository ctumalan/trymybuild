<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>AfterSchool Together — let’s work out the rides</title>
    <link rel="canonical" href="https://afterschool-together-app.vercel.app" />
    <meta
      name="description"
      content="Swimming, piano and pickups at the same time? Plan your family’s after-school rides and spot where you need a little help. Works offline in your browser."
    />
    <style>
/* AfterSchool Together — warm, calm, readable on a phone in a school car park. */

:root {
  --paper: #fbf6f0;
  --card: #fffdfb;
  --ink: #2b2521;
  --ink-soft: #6b6058;
  --ink-faint: #8c8078;
  --line: #e8dcd0;
  --line-strong: #d8c8b8;
  --clay: #b0512b;
  --clay-dark: #8d3f20;
  --clay-wash: #fbeee7;
  --leaf: #2f6b4f;
  --leaf-wash: #e8f2ec;
  --alert: #a83428;
  --alert-wash: #fceceb;
  --caution: #8a5605;
  --caution-wash: #fbf1de;

  --child-rose: #c8447a;
  --child-teal: #0f7268;
  --child-amber: #a06a06;
  --child-violet: #6f4fb0;
  --child-sky: #10648a;
  --child-moss: #4a7526;

  --radius: 14px;
  --radius-lg: 20px;
  --shadow: 0 1px 2px rgba(66, 46, 32, 0.06), 0 8px 24px rgba(66, 46, 32, 0.06);
  --shadow-lift: 0 2px 6px rgba(66, 46, 32, 0.08), 0 18px 44px rgba(66, 46, 32, 0.13);
  --sans: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 16px;
  line-height: 1.55;
}

h1, h2, h3, h4 { font-family: var(--sans); line-height: 1.25; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

button, input, select, textarea { font: inherit; color: inherit; }

/* Inline icons have no intrinsic size; give them one before anything else. */
svg { width: 18px; height: 18px; flex: none; }

:focus-visible {
  outline: 3px solid var(--clay);
  outline-offset: 2px;
  border-radius: 6px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--ink);
  color: #fff;
  padding: 12px 18px;
  z-index: 60;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}
.skip-link:focus { left: 0; }

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

/* --- buttons ------------------------------------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 11px 18px;
  border-radius: 999px;
  border: 1.5px solid transparent;
  background: var(--card);
  font-family: var(--sans);
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary { background: var(--clay); color: #fff; }
.btn-primary:hover { background: var(--clay-dark); }

.btn-quiet { background: var(--card); border-color: var(--line-strong); color: var(--ink); }
.btn-quiet:hover { background: #fff; border-color: var(--clay); }

.btn-plain {
  min-height: 0;
  padding: 4px 2px;
  background: none;
  border: none;
  border-radius: 4px;
  color: var(--clay-dark);
  font-family: var(--sans);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.btn-plain:hover { color: var(--ink); }

.btn-small { min-height: 38px; padding: 7px 14px; font-size: 0.875rem; }

.btn-danger { color: var(--alert); border-color: #e6c4c0; background: var(--card); }
.btn-danger:hover { background: var(--alert-wash); border-color: var(--alert); }

/* --- header ------------------------------------------------------------- */

.masthead {
  background: linear-gradient(178deg, #fdf3e9 0%, var(--paper) 100%);
  border-bottom: 1px solid var(--line);
}

.masthead-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 22px 20px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 16px 28px;
  justify-content: space-between;
}

.wordmark { display: flex; align-items: center; gap: 12px; }

.wordmark-mark {
  width: 42px; height: 42px;
  border-radius: 13px;
  background: var(--clay);
  display: grid;
  place-items: center;
  flex: none;
}
.wordmark-mark svg { width: 24px; height: 24px; }

.wordmark h1 { font-size: 1.3rem; }
.wordmark p { color: var(--ink-soft); font-size: 0.875rem; }

.masthead-note {
  max-width: 30rem;
  font-size: 0.85rem;
  color: var(--ink-soft);
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.masthead-note svg { width: 16px; height: 16px; flex: none; margin-top: 3px; }

/* --- shell -------------------------------------------------------------- */

.shell { max-width: 1180px; margin: 0 auto; padding: 0 20px 72px; }

.banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  margin-top: 18px;
  padding: 14px 18px;
  border-radius: var(--radius);
  border: 1.5px solid var(--line-strong);
  background: var(--card);
  font-size: 0.92rem;
}
.banner strong { font-family: var(--sans); }
.banner p { color: var(--ink-soft); flex: 1 1 18rem; }
.banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.banner.is-example { background: var(--caution-wash); border-color: #e6cfa6; }
.banner.is-alert { background: var(--alert-wash); border-color: #eec6c2; }
.banner-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--sans); font-weight: 700; font-size: 0.78rem;
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: 4px 10px; border-radius: 999px;
  background: #fff; border: 1.5px solid currentColor;
}
.banner-tag svg { width: 14px; height: 14px; }
.banner.is-example .banner-tag { color: var(--caution); }
.banner.is-alert .banner-tag { color: var(--alert); }

/* --- day picker --------------------------------------------------------- */

.daybar { margin: 22px 0 6px; }
.daybar-label {
  font-family: var(--sans); font-weight: 700; font-size: 0.78rem;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint);
  margin-bottom: 8px;
}
.daybar-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }

.day-chip {
  flex: 1 0 auto;
  min-width: 84px;
  min-height: 62px;
  padding: 8px 14px;
  border-radius: var(--radius);
  border: 1.5px solid var(--line-strong);
  background: var(--card);
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: var(--sans);
}
.day-chip span:first-child { font-weight: 700; font-size: 0.98rem; }
.day-chip small { color: var(--ink-faint); font-size: 0.75rem; font-family: var(--text); }
.day-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.day-chip[aria-pressed="true"] small { color: #e5d9cd; }
.day-chip:hover { border-color: var(--clay); }
.day-chip .chip-flag { color: var(--alert); font-weight: 700; font-size: 0.75rem; font-family: var(--text); display: inline-flex; align-items: center; gap: 4px; }
.day-chip .chip-flag svg { width: 14px; height: 14px; }
.day-chip[aria-pressed="true"] .chip-flag { color: #ffbaa8; }

/* --- layout ------------------------------------------------------------- */

.columns {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
  gap: 22px;
  align-items: start;
  margin-top: 18px;
}
@media (max-width: 900px) { .columns { grid-template-columns: minmax(0, 1fr); } }

.panel {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 20px;
}
.panel + .panel { margin-top: 18px; }

.panel-head {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px 14px; margin-bottom: 14px;
}
.panel-head .btn { white-space: nowrap; flex: none; }
.panel-head h2 { font-size: 1.12rem; }
.panel-head p { color: var(--ink-soft); font-size: 0.87rem; }

/* --- agenda ------------------------------------------------------------- */

.agenda { display: flex; flex-direction: column; gap: 12px; }

.agenda-item {
  border: 1.5px solid var(--line);
  border-left: 5px solid var(--child-line, var(--line-strong));
  border-radius: var(--radius);
  padding: 14px 16px;
  background: #fff;
}
.agenda-item.has-conflict { border-color: #eec6c2; background: #fffbfa; }

.agenda-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }

.child-tag {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--sans); font-weight: 700; font-size: 0.9rem;
  color: var(--child-line, var(--ink));
}
.child-tag .marker {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px; border-radius: 7px;
  background: var(--child-wash, #f1e7dc);
  font-size: 0.7rem; line-height: 1;
}

.agenda-time { font-family: var(--sans); font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
.agenda-item h3 { font-size: 1.05rem; margin-top: 6px; }
.agenda-where { color: var(--ink-soft); font-size: 0.9rem; margin-top: 2px; }

.trip-row {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 10px;
}
.trip-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 12px 5px 8px;
  border-radius: 999px;
  border: 1.5px solid var(--line-strong);
  background: var(--paper);
  font-size: 0.85rem;
}
.trip-pill svg { width: 15px; height: 15px; flex: none; color: var(--ink-soft); }
.trip-pill b { font-family: var(--sans); font-weight: 700; }
.trip-pill.is-open { border-color: var(--alert); background: var(--alert-wash); color: var(--alert); }
.trip-pill.is-open svg { color: var(--alert); }
.trip-pill.is-stay { border-color: #cbb69c; background: var(--caution-wash); color: var(--caution); }
.trip-pill.is-stay svg { color: var(--caution); }

.agenda-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.agenda-flag {
  display: flex; gap: 8px; align-items: flex-start;
  margin-top: 11px; padding: 9px 12px;
  border-radius: 10px; background: var(--alert-wash);
  color: var(--alert); font-size: 0.85rem;
}
.agenda-flag svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

/* --- conflicts ---------------------------------------------------------- */

.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: 10px; margin-bottom: 16px; }
.tally-item {
  border-radius: var(--radius);
  border: 1.5px solid var(--line);
  padding: 10px 14px;
  background: var(--paper);
}
.tally-item b { display: block; font-family: var(--sans); font-size: 1.5rem; line-height: 1.1; }
.tally-item span { font-size: 0.8rem; color: var(--ink-soft); }
.tally-item.is-clear { background: var(--leaf-wash); border-color: #bcd7c8; }
.tally-item.is-clear b { color: var(--leaf); }
.tally-item.is-alert { background: var(--alert-wash); border-color: #eec6c2; }
.tally-item.is-alert b { color: var(--alert); }
.tally-item.is-caution { background: var(--caution-wash); border-color: #e6cfa6; }
.tally-item.is-caution b { color: var(--caution); }

.conflict-card {
  border: 1.5px solid #eec6c2;
  border-radius: var(--radius);
  background: #fffbfa;
  padding: 15px 16px;
}
.conflict-card + .conflict-card { margin-top: 12px; }
.conflict-card.is-child { border-color: #cbb69c; background: #fffdf7; }

.conflict-head { display: flex; gap: 9px; align-items: flex-start; }
.conflict-head svg { width: 19px; height: 19px; flex: none; margin-top: 2px; color: var(--alert); }
.conflict-card.is-child .conflict-head svg { color: var(--caution); }
.conflict-head h3 { font-size: 1rem; }
.conflict-day { font-size: 0.8rem; color: var(--ink-soft); }
.conflict-why { margin-top: 8px; font-size: 0.92rem; color: var(--ink); }

.conflict-estimate {
  margin-top: 9px; padding: 8px 11px;
  border-radius: 9px; background: var(--caution-wash);
  color: var(--caution); font-size: 0.83rem;
  display: flex; gap: 7px; align-items: flex-start;
}
.conflict-estimate svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }

.choices { margin-top: 12px; }
.choices-label {
  font-family: var(--sans); font-weight: 700; font-size: 0.76rem;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint);
  margin-bottom: 7px;
}
.choices-list { display: flex; flex-wrap: wrap; gap: 8px; }
.choices-none { font-size: 0.86rem; color: var(--ink-soft); font-style: italic; }

.empty-note {
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--radius);
  padding: 22px 18px;
  text-align: center;
  color: var(--ink-soft);
}
.empty-note h3 { font-size: 1.05rem; color: var(--ink); margin-bottom: 6px; }
.empty-note .empty-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }

.all-clear {
  display: flex; gap: 11px; align-items: flex-start;
  border: 1.5px solid #bcd7c8; background: var(--leaf-wash);
  border-radius: var(--radius); padding: 15px 16px;
}
.all-clear svg { width: 20px; height: 20px; flex: none; color: var(--leaf); margin-top: 2px; }
.all-clear h3 { font-size: 1rem; color: var(--leaf); }
.all-clear p { font-size: 0.88rem; color: var(--ink-soft); margin-top: 3px; }

/* --- setup -------------------------------------------------------------- */

.section-toggle {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 20px;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  margin-top: 18px;
}
.section-toggle h2 { font-size: 1.05rem; }
.section-toggle p { font-size: 0.85rem; color: var(--ink-soft); }
.section-toggle .chev { transition: transform 0.18s ease; width: 18px; height: 18px; flex: none; }
.section-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }

.setup-body { margin-top: -4px; }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 18px; }

.setup-block h3 { font-size: 0.95rem; margin-bottom: 3px; display: flex; align-items: center; gap: 7px; }
.setup-block h3 svg { width: 17px; height: 17px; color: var(--clay); }
.setup-block > p { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 10px; }

.chip-list { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.entity-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 6px 5px 11px;
  border-radius: 999px;
  border: 1.5px solid var(--line-strong);
  background: var(--paper);
  font-size: 0.88rem;
}
.entity-chip .marker {
  display: inline-grid; place-items: center;
  width: 20px; height: 20px; border-radius: 6px;
  background: var(--child-wash, #f1e7dc); color: var(--child-line, var(--ink));
  font-size: 0.66rem;
}
.entity-chip button {
  width: 24px; height: 24px;
  border-radius: 50%; border: none;
  background: transparent; color: var(--ink-faint);
  cursor: pointer; display: grid; place-items: center;
}
.entity-chip button:hover { background: var(--alert-wash); color: var(--alert); }
.entity-chip button svg { width: 13px; height: 13px; }

.inline-add { display: flex; gap: 7px; }
.inline-add input { flex: 1 1 auto; min-width: 0; }

.field { display: block; margin-bottom: 12px; }
.field > span {
  display: block;
  font-family: var(--sans); font-weight: 600; font-size: 0.85rem;
  margin-bottom: 5px;
}
.field small { display: block; color: var(--ink-soft); font-size: 0.79rem; font-weight: 400; margin-top: 2px; }

input[type="text"], input[type="time"], input[type="number"], select, textarea {
  width: 100%;
  min-height: 44px;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1.5px solid var(--line-strong);
  background: #fff;
}
input:hover, select:hover { border-color: var(--clay); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }

.route-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.route-table th {
  text-align: left; font-family: var(--sans); font-size: 0.76rem;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint);
  padding: 0 8px 7px 0; font-weight: 700;
}
.route-table td { padding: 5px 8px 5px 0; border-top: 1px solid var(--line); vertical-align: middle; }
.route-table td:last-child, .route-table th:last-child { padding-right: 0; width: 6.5rem; }
.route-table input { min-height: 40px; text-align: right; }
.route-estimated { font-size: 0.78rem; color: var(--caution); font-family: var(--sans); font-weight: 600; }
.route-known { font-size: 0.78rem; color: var(--leaf); font-family: var(--sans); font-weight: 600; }

.settings-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 14px; }

/* --- data actions ------------------------------------------------------- */

.action-row { display: flex; flex-wrap: wrap; gap: 8px; }

.fineprint {
  margin-top: 14px;
  font-size: 0.83rem;
  color: var(--ink-soft);
}
.fineprint li { padding-left: 18px; position: relative; margin-top: 6px; }
.fineprint li::before { content: "•"; position: absolute; left: 5px; color: var(--ink-faint); }

/* --- dialogs ------------------------------------------------------------ */

dialog {
  width: min(560px, calc(100vw - 28px));
  border: none;
  border-radius: var(--radius-lg);
  padding: 0;
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow-lift);
}
dialog::backdrop { background: rgba(43, 37, 33, 0.42); }

.dialog-inner { padding: 22px; max-height: min(84vh, 780px); overflow-y: auto; }
.dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.dialog-head h2 { font-size: 1.15rem; }
.dialog-head p { font-size: 0.86rem; color: var(--ink-soft); margin-top: 3px; }
.dialog-close {
  width: 38px; height: 38px; flex: none;
  border-radius: 50%; border: 1.5px solid var(--line-strong);
  background: var(--card); cursor: pointer;
  display: grid; place-items: center;
}
.dialog-close:hover { background: var(--alert-wash); border-color: var(--alert); color: var(--alert); }
.dialog-close svg { width: 15px; height: 15px; }

.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .field-pair { grid-template-columns: 1fr; } }

.check-field {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 13px 14px;
  border: 1.5px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--paper);
  margin-bottom: 12px;
  cursor: pointer;
}
.check-field input { width: 22px; height: 22px; min-height: 0; flex: none; margin-top: 1px; accent-color: var(--clay); }
.check-field b { font-family: var(--sans); font-size: 0.92rem; }
.check-field small { display: block; color: var(--ink-soft); font-size: 0.82rem; margin-top: 2px; }

.form-error {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 11px 13px; margin-bottom: 14px;
  border-radius: 10px;
  background: var(--alert-wash); color: var(--alert);
  border: 1.5px solid #eec6c2;
  font-size: 0.87rem;
}
.form-error svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

.dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.dialog-actions .spacer { margin-right: auto; }

.plan-text {
  width: 100%;
  min-height: 15rem;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 0.82rem;
  line-height: 1.5;
  white-space: pre;
  overflow-wrap: normal;
  overflow-x: auto;
}

/* --- toast -------------------------------------------------------------- */

.toast-anchor {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 50;
  width: min(30rem, calc(100vw - 24px));
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex; gap: 10px; align-items: flex-start;
  padding: 13px 16px;
  border-radius: var(--radius);
  background: var(--ink);

/* ---- src/lib/time.js ---- */
// Time helpers. Pure functions, no DOM, safe to unit test.

const DAYS = [
  { id: "mon", label: "Monday", short: "Mon" },
  { id: "tue", label: "Tuesday", short: "Tue" },
  { id: "wed", label: "Wednesday", short: "Wed" },
  { id: "thu", label: "Thursday", short: "Thu" },
  { id: "fri", label: "Friday", short: "Fri" },
  { id: "sat", label: "Saturday", short: "Sat" },
  { id: "sun", label: "Sunday", short: "Sun" },
];

const DAY_IDS = DAYS.map(day => day.id);

function dayLabel(dayId) {
  return DAYS.find(day => day.id === dayId)?.label || "Unknown day";
}

// "15:30" -> 930. Returns null for anything that is not a real clock time.
function parseTime(value) {
  if (typeof value !== "string") return null;
  const match = /^(\d{1,2}):(\d{2})$/.exec(value.trim());
  if (!match) return null;
  const hours = Number(match[1]);
  const minutes = Number(match[2]);
  if (!Number.isInteger(hours) || !Number.isInteger(minutes)) return null;
  if (hours > 23 || minutes > 59) return null;
  return hours * 60 + minutes;
}

// 930 -> "15:30" (the value shape an <input type="time"> expects).
function toTimeValue(minutes) {
  if (!Number.isFinite(minutes)) return "";
  const total = ((Math.round(minutes) % 1440) + 1440) % 1440;
  return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
}

// 930 -> "3:30 PM"
function formatTime(minutes) {
  if (!Number.isFinite(minutes)) return "—";
  const total = ((Math.round(minutes) % 1440) + 1440) % 1440;
  const hours24 = Math.floor(total / 60);
  const mins = total % 60;
  const suffix = hours24 < 12 ? "AM" : "PM";
  const hours12 = hours24 % 12 === 0 ? 12 : hours24 % 12;
  return `${hours12}:${String(mins).padStart(2, "0")} ${suffix}`;
}

// 75 -> "1 hr 15 min"
function formatMinutes(minutes) {
  if (!Number.isFinite(minutes)) return "—";
  const value = Math.max(0, Math.round(minutes));
  if (value < 60) return `${value} min`;
  const hours = Math.floor(value / 60);
  const rest = value % 60;
  return rest ? `${hours} hr ${rest} min` : `${hours} hr`;
}

// Non-negative integers only. Used for travel times and the handoff buffer.
function parseMinutesInput(value) {
  if (typeof value === "number") return Number.isFinite(value) && value >= 0 ? Math.round(value) : null;
  if (typeof value !== "string") return null;
  const trimmed = value.trim();
  if (trimmed === "" || !/^\d+$/.test(trimmed)) return null;
  const parsed = Number(trimmed);
  return Number.isFinite(parsed) && parsed >= 0 ? parsed : null;
}

/* ---- src/lib/conflicts.js ---- */
// Transport feasibility engine.
//
// The question this answers is not "do two events overlap?" but "can one adult
// physically make every trip they have been given?".
//
// Every activity produces trips (obligations) that put a named adult at a named
// place at a named time. Two trips for the same adult on the same day are
// compared using the travel time the family entered between those places, plus a
// visible arrival/handoff buffer. Children are checked separately, because a
// child can be double-booked even when two different adults are driving.
//
// Pure module: no DOM, no storage, no clock. Deterministic for tests.


const ROLE_LABEL = { dropoff: "Drop-off", pickup: "Pickup", stay: "Stay for the whole session" };

// ---------------------------------------------------------------------------
// Settings and routes
// ---------------------------------------------------------------------------

function readSettings(plan) {
  const issues = [];
  const raw = plan?.settings || {};
  let bufferMinutes = parseMinutesInput(raw.bufferMinutes);
  if (bufferMinutes === null) {
    if (raw.bufferMinutes !== undefined) {
      issues.push({ type: "invalid-buffer", message: "The handoff buffer must be a whole number of minutes, so 10 minutes is being used instead." });
    }
    bufferMinutes = DEFAULT_SETTINGS.bufferMinutes;
  }
  let defaultTravelMinutes = parseMinutesInput(raw.defaultTravelMinutes);
  if (defaultTravelMinutes === null) {
    if (raw.defaultTravelMinutes !== undefined) {
      issues.push({ type: "invalid-default-travel", message: "The estimated travel time must be a whole number of minutes, so 20 minutes is being used instead." });
    }
    defaultTravelMinutes = DEFAULT_SETTINGS.defaultTravelMinutes;
  }
  return { bufferMinutes, defaultTravelMinutes, issues };
}

// Travel between two places. Same place is genuinely zero. A missing route is
// never treated as "fine" — it is returned as an explicit estimate.
function travelBetween(plan, fromVenueId, toVenueId, settings) {
  const config = settings || readSettings(plan);
  if (fromVenueId === toVenueId) {
    return { minutes: 0, estimated: false, sameVenue: true };
  }
  for (const route of plan?.routes || []) {
    const matches =
      (route.fromVenueId === fromVenueId && route.toVenueId === toVenueId) ||
      (route.fromVenueId === toVenueId && route.toVenueId === fromVenueId);
    if (!matches) continue;
    const minutes = parseMinutesInput(route.minutes);
    if (minutes === null) break; // invalid entry: fall through to the estimate
    return { minutes, estimated: false, sameVenue: false };
  }
  return { minutes: config.defaultTravelMinutes, estimated: true, sameVenue: false };
}

// Minutes one adult needs between finishing at one place and being due at another.
// Same place needs nothing: the adult is already standing there.
function requiredGap(plan, fromVenueId, toVenueId, settings) {
  const config = settings || readSettings(plan);
  const travel = travelBetween(plan, fromVenueId, toVenueId, config);
  if (travel.sameVenue) {
    return { minutes: 0, travelMinutes: 0, bufferMinutes: 0, estimated: false, sameVenue: true };
  }
  return {
    minutes: travel.minutes + config.bufferMinutes,
    travelMinutes: travel.minutes,
    bufferMinutes: config.bufferMinutes,
    estimated: travel.estimated,
    sameVenue: false,
  };
}

// ---------------------------------------------------------------------------
// Trips
// ---------------------------------------------------------------------------

// Turns activities into the trips adults actually have to make.
// Returns { obligations, unassigned, issues, valid }.
function buildObligations(plan) {
  const obligations = [];
  const unassigned = [];
  const issues = [];
  const valid = [];
  const childIds = new Set((plan?.children || []).map(child => child.id));
  const venueIds = new Set((plan?.venues || []).map(venue => venue.id));
  const caregiverIds = new Set((plan?.caregivers || []).map(caregiver => caregiver.id));

  for (const activity of plan?.activities || []) {
    const start = parseTime(activity.start);
    const end = parseTime(activity.end);
    if (start === null || end === null) {
      issues.push({ type: "invalid-time", activityId: activity.id, dayId: activity.day, message: `“${activity.name || "Untitled activity"}” has a start or end time that is not a real clock time, so it is not being checked.` });
      continue;
    }
    if (end <= start) {
      issues.push({ type: "invalid-time", activityId: activity.id, dayId: activity.day, message: `“${activity.name || "Untitled activity"}” ends at or before it starts, so it is not being checked.` });
      continue;
    }
    if (!DAY_IDS.includes(activity.day)) {
      issues.push({ type: "invalid-day", activityId: activity.id, message: `“${activity.name || "Untitled activity"}” is not on a recognised weekday, so it is not being checked.` });
      continue;
    }
    if (!childIds.has(activity.childId)) {
      issues.push({ type: "unknown-child", activityId: activity.id, dayId: activity.day, message: `“${activity.name || "Untitled activity"}” is not linked to a child yet.` });
      continue;
    }
    if (!venueIds.has(activity.venueId)) {
      issues.push({ type: "unknown-venue", activityId: activity.id, dayId: activity.day, message: `“${activity.name || "Untitled activity"}” does not have a place yet, so travel cannot be checked.` });
      continue;
    }

    const resolved = { ...activity, startMinutes: start, endMinutes: end };
    valid.push(resolved);

    const dropoffId = caregiverIds.has(activity.dropoffCaregiverId) ? activity.dropoffCaregiverId : null;
    const pickupId = caregiverIds.has(activity.pickupCaregiverId) ? activity.pickupCaregiverId : null;
    const base = {
      activityId: activity.id,
      activityName: activity.name || "Untitled activity",
      childId: activity.childId,
      venueId: activity.venueId,
      dayId: activity.day,
      adultStays: Boolean(activity.adultStays),
    };

    if (activity.adultStays) {
      // The adult is held at the venue for the entire session.
      const stay = { ...base, key: `${activity.id}:stay`, role: "stay", caregiverId: dropoffId, from: start, to: end };
      if (dropoffId) obligations.push(stay);
      else {
        unassigned.push(stay);
        issues.push({ type: "unassigned", activityId: activity.id, dayId: activity.day, role: "stay", message: `“${base.activityName}” needs an adult to stay for the whole session, and nobody is assigned yet.` });
      }
      // A different adult may take over at the end; the staying adult hands off in person.
      if (pickupId && pickupId !== dropoffId) {
        obligations.push({ ...base, key: `${activity.id}:pickup`, role: "pickup", caregiverId: pickupId, from: end, to: end });
      }
      continue;
    }

    const dropoff = { ...base, key: `${activity.id}:dropoff`, role: "dropoff", caregiverId: dropoffId, from: start, to: start };
    if (dropoffId) obligations.push(dropoff);
    else {
      unassigned.push(dropoff);
      issues.push({ type: "unassigned", activityId: activity.id, dayId: activity.day, role: "dropoff", message: `“${base.activityName}” has no drop-off driver yet.` });
    }

    const pickup = { ...base, key: `${activity.id}:pickup`, role: "pickup", caregiverId: pickupId, from: end, to: end };
    if (pickupId) obligations.push(pickup);
    else {
      unassigned.push(pickup);
      issues.push({ type: "unassigned", activityId: activity.id, dayId: activity.day, role: "pickup", message: `“${base.activityName}” has no pickup driver yet.` });
    }
  }

  return { obligations, unassigned, issues, valid };
}

// ---------------------------------------------------------------------------
// Conflicts
// ---------------------------------------------------------------------------

function sortByStart(a, b) {
  return a.from - b.from || a.to - b.to || a.key.localeCompare(b.key);
}

function groupBy(items, keyFn) {
  const map = new Map();
  for (const item of items) {
    const key = keyFn(item);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(item);
  }
  return map;
}

// Every pair of trips one adult has on one day, not just neighbours: a long
// "stay" can collide with a trip two slots later.
function findDriverConflicts(plan, obligations, settings) {
  const config = settings || readSettings(plan);
  const conflicts = [];
  const byDriverDay = groupBy(obligations, item => `${item.caregiverId}|${item.dayId}`);

  for (const [, group] of byDriverDay) {
    const sorted = [...group].sort(sortByStart);
    for (let i = 0; i < sorted.length; i += 1) {
      for (let j = i + 1; j < sorted.length; j += 1) {
        const earlier = sorted[i];
        const later = sorted[j];
        if (earlier.activityId === later.activityId) continue; // same session, already consistent
        const need = requiredGap(plan, earlier.venueId, later.venueId, config);
        const gap = later.from - earlier.to;
        if (gap >= need.minutes) continue; // exactly meeting the requirement is feasible
        conflicts.push({
          id: `driver|${earlier.caregiverId}|${earlier.dayId}|${earlier.key}|${later.key}`,
          kind: "driver",
          dayId: earlier.dayId,
          caregiverId: earlier.caregiverId,
          first: earlier,
          second: later,
          gapMinutes: gap,
          requiredMinutes: need.minutes,
          shortfallMinutes: need.minutes - gap,
          travelMinutes: need.travelMinutes,
          bufferMinutes: need.bufferMinutes,
          estimated: need.estimated,
          sameVenue: need.sameVenue,
        });
      }
    }
  }
  return conflicts;
}

// A child cannot be in two places at once, whoever is driving.
function findChildConflicts(plan, activities, settings) {
  const config = settings || readSettings(plan);
  const conflicts = [];
  const byChildDay = groupBy(activities, item => `${item.childId}|${item.day}`);

  for (const [, group] of byChildDay) {
    const sorted = [...group].sort((a, b) => a.startMinutes - b.startMinutes || a.endMinutes - b.endMinutes || a.id.localeCompare(b.id));
    for (let i = 0; i < sorted.length; i += 1) {
      for (let j = i + 1; j < sorted.length; j += 1) {
        const earlier = sorted[i];
        const later = sorted[j];
        const overlaps = earlier.startMinutes < later.endMinutes && later.startMinutes < earlier.endMinutes;
        const need = requiredGap(plan, earlier.venueId, later.venueId, config);
        const gap = later.startMinutes - earlier.endMinutes;
        if (!overlaps && gap >= need.minutes) continue;
        conflicts.push({
          id: `${overlaps ? "child-overlap" : "child-travel"}|${earlier.childId}|${earlier.day}|${earlier.id}|${later.id}`,
          kind: overlaps ? "child-overlap" : "child-travel",
          dayId: earlier.day,
          childId: earlier.childId,
          first: earlier,
          second: later,
          gapMinutes: gap,
          requiredMinutes: need.minutes,
          shortfallMinutes: need.minutes - gap,
          travelMinutes: need.travelMinutes,
          bufferMinutes: need.bufferMinutes,
          estimated: need.estimated,
          sameVenue: need.sameVenue,
        });
      }
    }
  }
  return conflicts;
}

function analyzePlan(plan) {
  const settings = readSettings(plan);
  const { obligations, unassigned, issues, valid } = buildObligations(plan);
  const driverConflicts = findDriverConflicts(plan, obligations, settings);
  const childConflicts = findChildConflicts(plan, valid, settings);
  const conflicts = [...driverConflicts, ...childConflicts];

  // Venue pairs where no real travel time exists, so the answer is an estimate.
  const estimatedPairs = new Map();
  const noteEstimate = (fromVenueId, toVenueId) => {
    if (fromVenueId === toVenueId) return;
    const need = requiredGap(plan, fromVenueId, toVenueId, settings);
    if (!need.estimated) return;
    const key = [fromVenueId, toVenueId].sort().join("|");
    if (!estimatedPairs.has(key)) estimatedPairs.set(key, { fromVenueId, toVenueId, minutes: need.travelMinutes });
  };
  for (const [, group] of groupBy(obligations, item => `${item.caregiverId}|${item.dayId}`)) {
    const sorted = [...group].sort(sortByStart);
    for (let i = 0; i < sorted.length; i += 1) {
      for (let j = i + 1; j < sorted.length; j += 1) noteEstimate(sorted[i].venueId, sorted[j].venueId);
    }
  }
  for (const [, group] of groupBy(valid, item => `${item.childId}|${item.day}`)) {
    for (let i = 0; i < group.length; i += 1) {
      for (let j = i + 1; j < group.length; j += 1) noteEstimate(group[i].venueId, group[j].venueId);
    }
  }

  const allIssues = [...settings.issues, ...issues];
  const byDay = {};
  for (const dayId of DAY_IDS) {
    byDay[dayId] = {
      activities: valid.filter(activity => activity.day === dayId),
      obligations: obligations.filter(item => item.dayId === dayId),
      unassigned: unassigned.filter(item => item.dayId === dayId),
      conflicts: conflicts.filter(item => item.dayId === dayId),
      issues: allIssues.filter(item => item.dayId === dayId),
    };
  }

  return {
    settings,
    obligations,
    unassigned,
    activities: valid,
    conflicts,
    driverConflicts,
    childConflicts,
    issues: allIssues,
    estimatedRoutes: [...estimatedPairs.values()],
    byDay,
    counts: {
      conflicts: conflicts.length,
      driverConflicts: driverConflicts.length,
      childConflicts: childConflicts.length,
      issues: allIssues.length,
      unassigned: unassigned.length,
      estimatedRoutes: estimatedPairs.size,
    },
  };
}

// ---------------------------------------------------------------------------
// Suggestions
// ---------------------------------------------------------------------------

// Returns a copy of the plan with one trip handed to a different adult.
function reassignTrip(plan, trip, caregiverId) {
  return {
    ...plan,
    activities: (plan.activities || []).map(activity => {
      if (activity.id !== trip.activityId) return activity;
      if (trip.role === "pickup") return { ...activity, pickupCaregiverId: caregiverId };
      const next = { ...activity, dropoffCaregiverId: caregiverId };
      // When one adult stays for the whole session, whoever stays also collects
      // the child unless a different adult was named for pickup.
      if (trip.role === "stay" && activity.pickupCaregiverId === activity.dropoffCaregiverId) {
        next.pickupCaregiverId = caregiverId;
      }
      return next;
    }),
  };
}

// Alternate adults are only offered when that adult's whole day still works.
// Nothing here contacts anyone or treats a ride as agreed — it is a suggestion
// the parent has to click.
function suggestAlternateDrivers(plan, conflict) {
  if (!conflict || conflict.kind !== "driver") return [];
  const baseline = analyzePlan(plan).counts.conflicts;
  const suggestions = [];

  for (const trip of [conflict.first, conflict.second]) {
    for (const caregiver of plan.caregivers || []) {
      if (caregiver.id === conflict.caregiverId) continue;
      const candidatePlan = reassignTrip(plan, trip, caregiver.id);
      const result = analyzePlan(candidatePlan);
      if (result.conflicts.some(item => item.id === conflict.id)) continue;
      if (result.counts.conflicts >= baseline) continue;
      const theirTrouble = result.conflicts.filter(
        item => item.kind === "driver" && item.caregiverId === caregiver.id,
      );
      if (theirTrouble.length) continue; // their own schedule would stop working
      suggestions.push({
        caregiverId: caregiver.id,
        trip,
        remainingConflicts: result.counts.conflicts,
        resolvedCount: baseline - result.counts.conflicts,
      });
    }
  }
  return suggestions;
}

// Local persistence and versioned backup files.
//
// Everything lives in this browser. Nothing is sent anywhere. If the stored
// data is unreadable it is kept aside rather than thrown away, and the app
// starts from the example week instead of a blank screen.


const STORAGE_KEY = "afterschool-together.plan.v1";
const CORRUPT_BACKUP_KEY = "afterschool-together.unreadable-backup.v1";

const isPlainObject = value => Boolean(value) && typeof value === "object" && !Array.isArray(value);
const cleanText = (value, fallback = "") => {
  if (typeof value !== "string") return fallback;
  const trimmed = value.trim().replace(/\s+/g, " ");
  return trimmed.slice(0, 60) || fallback;
};

function normalizePeople(list, prefix, errors, colored = false) {
  const out = [];
  const seen = new Set();
  if (list !== undefined && !Array.isArray(list)) {
    errors.push(`The "${prefix}" section is not a list, so it was skipped.`);
    return out;
  }
  for (const entry of list || []) {
    if (!isPlainObject(entry) || typeof entry.id !== "string" || !entry.id.trim()) {
      errors.push(`One ${prefix} entry was missing an id and was skipped.`);
      continue;
    }
    if (seen.has(entry.id)) {
      errors.push(`Two ${prefix} entries shared the id "${entry.id}"; the second was skipped.`);
      continue;
    }
    const name = cleanText(entry.name);
    if (!name) {
      errors.push(`One ${prefix} entry had no name and was skipped.`);
      continue;
    }
    seen.add(entry.id);
    const person = { id: entry.id, name };
    if (colored) {
      person.color = CHILD_COLORS.some(color => color.id === entry.color) ? entry.color : CHILD_COLORS[out.length % CHILD_COLORS.length].id;
    }
    out.push(person);
  }
  return out;
}

// Turns unknown data into a plan we can safely render, collecting every repair.
function normalizePlan(raw) {
  const errors = [];
  if (!isPlainObject(raw)) {
    return { ok: false, plan: emptyPlan(), errors: ["The file did not contain a plan object."] };
  }
  if (raw.version !== undefined && (typeof raw.version !== "number" || !Number.isInteger(raw.version) || raw.version < 1)) {
    return { ok: false, plan: emptyPlan(), errors: ["The plan version is not a whole number, so the file was not opened."] };
  }
  if (typeof raw.version === "number" && raw.version > PLAN_VERSION) {
    return { ok: false, plan: emptyPlan(), errors: [`This backup was written by a newer version of AfterSchool Together (version ${raw.version}). Update the app before opening it.`] };
  }

  const children = normalizePeople(raw.children, "child", errors, true);
  const caregivers = normalizePeople(raw.caregivers, "caregiver", errors);
  const venues = normalizePeople(raw.venues, "place", errors);
  const childIds = new Set(children.map(child => child.id));
  const caregiverIds = new Set(caregivers.map(caregiver => caregiver.id));
  const venueIds = new Set(venues.map(venue => venue.id));

  const routes = [];
  const routeSeen = new Set();
  if (raw.routes !== undefined && !Array.isArray(raw.routes)) errors.push('The "routes" section is not a list, so it was skipped.');
  for (const entry of Array.isArray(raw.routes) ? raw.routes : []) {
    if (!isPlainObject(entry) || !venueIds.has(entry.fromVenueId) || !venueIds.has(entry.toVenueId)) {
      errors.push("One travel time referred to a place that is not in the file and was skipped.");
      continue;
    }
    if (entry.fromVenueId === entry.toVenueId) continue;
    const minutes = parseMinutesInput(entry.minutes);
    if (minutes === null) {
      errors.push("One travel time was not a whole number of minutes and was skipped.");
      continue;
    }
    const key = [entry.fromVenueId, entry.toVenueId].sort().join("|");
    if (routeSeen.has(key)) {
      errors.push("Two travel times described the same pair of places; the second was skipped.");
      continue;
    }
    routeSeen.add(key);
    routes.push({
      id: typeof entry.id === "string" && entry.id ? entry.id : `route_${routes.length + 1}`,
      fromVenueId: entry.fromVenueId,
      toVenueId: entry.toVenueId,
      minutes,
    });
  }

  const activities = [];
  const activitySeen = new Set();
  if (raw.activities !== undefined && !Array.isArray(raw.activities)) errors.push('The "activities" section is not a list, so it was skipped.');
  for (const entry of Array.isArray(raw.activities) ? raw.activities : []) {
    if (!isPlainObject(entry) || typeof entry.id !== "string" || !entry.id.trim()) {
      errors.push("One activity was missing an id and was skipped.");
      continue;
    }
    if (activitySeen.has(entry.id)) {
      errors.push(`Two activities shared the id "${entry.id}"; the second was skipped.`);
      continue;
    }
    if (!childIds.has(entry.childId)) {
      errors.push(`“${cleanText(entry.name, "One activity")}” pointed at a child who is not in the file and was skipped.`);
      continue;
    }
    if (!venueIds.has(entry.venueId)) {
      errors.push(`“${cleanText(entry.name, "One activity")}” pointed at a place that is not in the file and was skipped.`);
      continue;
    }
    if (!DAY_IDS.includes(entry.day)) {
      errors.push(`“${cleanText(entry.name, "One activity")}” was not on a recognised weekday and was skipped.`);
      continue;
    }
    if (parseTime(entry.start) === null || parseTime(entry.end) === null) {
      errors.push(`“${cleanText(entry.name, "One activity")}” had a time that is not a real clock time and was skipped.`);
      continue;
    }
    if (entry.dropoffCaregiverId != null && !caregiverIds.has(entry.dropoffCaregiverId)) {
      errors.push(`“${cleanText(entry.name, "One activity")}” named a drop-off driver who is not in the file, so that trip is unassigned.`);
    }
    if (entry.pickupCaregiverId != null && !caregiverIds.has(entry.pickupCaregiverId)) {
      errors.push(`“${cleanText(entry.name, "One activity")}” named a pickup driver who is not in the file, so that trip is unassigned.`);
    }
    activitySeen.add(entry.id);
    activities.push({
      id: entry.id,
      childId: entry.childId,
      name: cleanText(entry.name, "Untitled activity"),
      venueId: entry.venueId,
      day: entry.day,
      start: entry.start.trim(),
      end: entry.end.trim(),
      dropoffCaregiverId: caregiverIds.has(entry.dropoffCaregiverId) ? entry.dropoffCaregiverId : null,
      pickupCaregiverId: caregiverIds.has(entry.pickupCaregiverId) ? entry.pickupCaregiverId : null,
      adultStays: entry.adultStays === true,
    });
  }

  const rawSettings = isPlainObject(raw.settings) ? raw.settings : {};
  const bufferMinutes = parseMinutesInput(rawSettings.bufferMinutes);
  const defaultTravelMinutes = parseMinutesInput(rawSettings.defaultTravelMinutes);
  if (rawSettings.bufferMinutes !== undefined && bufferMinutes === null) errors.push("The handoff buffer was not a whole number of minutes, so 10 minutes is being used.");
  if (rawSettings.defaultTravelMinutes !== undefined && defaultTravelMinutes === null) errors.push("The estimated travel time was not a whole number of minutes, so 20 minutes is being used.");

  return {
    ok: true,
    errors,
    plan: {
      version: PLAN_VERSION,
      isExample: raw.isExample === true,
      children,
      caregivers,
      venues,
      routes,
      activities,
      settings: {
        bufferMinutes: bufferMinutes === null ? DEFAULT_SETTINGS.bufferMinutes : bufferMinutes,
        defaultTravelMinutes: defaultTravelMinutes === null ? DEFAULT_SETTINGS.defaultTravelMinutes : defaultTravelMinutes,
      },
    },
  };
}

// ---------------------------------------------------------------------------
// Backup files
// ---------------------------------------------------------------------------

function buildBackup(plan, savedAt) {
  return {
    format: BACKUP_FORMAT,
    version: PLAN_VERSION,
    savedAt: savedAt || null,
    plan: { ...plan, isExample: plan.isExample === true },
  };
}

function readBackup(text) {
  if (typeof text !== "string" || !text.trim()) {
    return { ok: false, errors: ["That file was empty."], plan: null };
  }
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch {
    return { ok: false, errors: ["That file is not valid JSON, so nothing was changed."], plan: null };
  }
  if (!isPlainObject(parsed)) {
    return { ok: false, errors: ["That file does not contain an AfterSchool Together backup."], plan: null };
  }
  if (parsed.format !== BACKUP_FORMAT) {
    return { ok: false, errors: ["That file is not an AfterSchool Together backup, so nothing was changed."], plan: null };
  }
  if (typeof parsed.version !== "number" || !Number.isInteger(parsed.version) || parsed.version < 1) {
    return { ok: false, errors: ["That backup does not say which version it is, so nothing was changed."], plan: null };
  }
  if (parsed.version > PLAN_VERSION) {
    return { ok: false, errors: [`That backup was written by a newer version (version ${parsed.version}). Update the app first.`], plan: null };
  }
  const result = normalizePlan(parsed.plan);
  if (!result.ok) return { ok: false, errors: result.errors, plan: null };
  return { ok: true, errors: result.errors, plan: result.plan, savedAt: typeof parsed.savedAt === "string" ? parsed.savedAt : null };
}

// ---------------------------------------------------------------------------
// Browser storage
// ---------------------------------------------------------------------------

// status: "first-run" | "loaded" | "recovered" | "unavailable"
function loadPlan(storage) {
  if (!storage) return { plan: examplePlan(), status: "unavailable", errors: ["This browser is not allowing local storage, so your plan cannot be saved between visits."] };
  let stored = null;
  try {
    stored = storage.getItem(STORAGE_KEY);
  } catch {
    return { plan: examplePlan(), status: "unavailable", errors: ["This browser blocked local storage, so your plan cannot be saved between visits."] };
  }
  if (stored === null) return { plan: examplePlan(), status: "first-run", errors: [] };

  let parsed = null;
  try {
    parsed = JSON.parse(stored);
  } catch {
    return { plan: examplePlan(), status: "recovered", errors: ["The saved plan in this browser could not be read. It has been kept aside untouched and the example week is shown instead."], rescued: stored };
  }
  const result = normalizePlan(parsed);
  if (!result.ok) {
    return { plan: examplePlan(), status: "recovered", errors: [...result.errors, "The example week is shown instead. Your old data was kept aside, not deleted."], rescued: stored };
  }
  return { plan: result.plan, status: "loaded", errors: result.errors };
}

function savePlan(storage, plan) {
  if (!storage) return { ok: false, error: "This browser is not allowing local storage, so nothing was saved." };
  try {
    storage.setItem(STORAGE_KEY, JSON.stringify(plan));
    return { ok: true, error: null };
  } catch (error) {
    const name = error && typeof error === "object" && "name" in error ? String(error.name) : "";
    if (name === "QuotaExceededError" || name === "NS_ERROR_DOM_QUOTA_REACHED") {
      return { ok: false, error: "This browser has run out of local storage, so the last change was not saved. Export a backup before making more changes." };
    }
    return { ok: false, error: "This browser refused to save the change. Export a backup so you do not lose it." };
  }
}

function keepUnreadable(storage, rescued) {
  if (!storage || typeof rescued !== "string") return false;
  try {
    storage.setItem(CORRUPT_BACKUP_KEY, rescued);
    return true;
  } catch {
    return false;
  }
}

// Plain-language explanations and the copyable daily driver plan.
// Pure text builders so both the screen and the clipboard say the same thing.


function tripLabel(plan, trip) {
  const child = childName(plan, trip.childId);
  const place = venueName(plan, trip.venueId);
  if (trip.role === "stay") {
    return `staying with ${child} at ${place} for ${trip.activityName} (${formatTime(trip.from)}–${formatTime(trip.to)})`;
  }
  const verb = trip.role === "dropoff" ? "dropping off" : "picking up";
  return `${verb} ${child} at ${place} for ${trip.activityName} (${formatTime(trip.from)})`;
}

function shortTripLabel(plan, trip) {
  const child = childName(plan, trip.childId);
  if (trip.role === "stay") return `Stay with ${child} · ${formatTime(trip.from)}–${formatTime(trip.to)}`;
  const verb = trip.role === "dropoff" ? "Drop off" : "Pick up";
  return `${verb} ${child} · ${formatTime(trip.from)}`;
}

// Reads as the middle of a sentence: "Ask Aunt Dee to <phrase>".
function handoverPhrase(plan, trip) {
  const child = childName(plan, trip.childId);
  if (trip.role === "stay") return `stay with ${child}, ${formatTime(trip.from)} to ${formatTime(trip.to)}`;
  if (trip.role === "dropoff") return `drop ${child} off at ${formatTime(trip.from)}`;
  return `pick up ${child} at ${formatTime(trip.from)}`;
}

// One sentence naming the two competing trips and how far short the day falls.
function explainConflict(plan, conflict) {
  if (conflict.kind === "driver") {
    const who = caregiverName(plan, conflict.caregiverId);
    const first = tripLabel(plan, conflict.first);
    const second = tripLabel(plan, conflict.second);
    const travel = conflict.sameVenue
      ? "the same place, so no travel is needed"
      : `${formatMinutes(conflict.travelMinutes)} of travel plus ${formatMinutes(conflict.bufferMinutes)} to park and hand over`;
    return `${who} is ${first} and then ${second}. That leaves ${describeGap(conflict.gapMinutes)} between them, but you need ${formatMinutes(conflict.requiredMinutes)} — ${travel}. Short by ${formatMinutes(conflict.shortfallMinutes)}.`;
  }
  const child = childName(plan, conflict.childId);
  const first = `${conflict.first.name} at ${venueName(plan, conflict.first.venueId)} (${formatTime(conflict.first.startMinutes)}–${formatTime(conflict.first.endMinutes)})`;
  const second = `${conflict.second.name} at ${venueName(plan, conflict.second.venueId)} (${formatTime(conflict.second.startMinutes)}–${formatTime(conflict.second.endMinutes)})`;
  if (conflict.kind === "child-overlap") {
    return `${child} is booked for ${first} and ${second} at the same time. Whoever drives, ${child} can only be in one of them.`;
  }
  return `${child} finishes ${first} and is due at ${second}. That leaves ${describeGap(conflict.gapMinutes)}, but the trip needs ${formatMinutes(conflict.requiredMinutes)}. Short by ${formatMinutes(conflict.shortfallMinutes)}.`;
}

function describeGap(minutes) {
  if (minutes < 0) return `an overlap of ${formatMinutes(Math.abs(minutes))}`;
  if (minutes === 0) return "no time at all";
  return formatMinutes(minutes);
}

function conflictTitle(plan, conflict) {
  if (conflict.kind === "driver") return `${caregiverName(plan, conflict.caregiverId)} cannot make both trips`;
  if (conflict.kind === "child-overlap") return `${childName(plan, conflict.childId)} is booked twice at once`;
  return `${childName(plan, conflict.childId)} cannot get there in time`;
}

// The thing a parent actually copies into a message or prints for the fridge.
function dailyDriverPlanText(plan, analysis, dayId) {
  const day = analysis.byDay[dayId];
  const lines = [];
  lines.push(`${dayLabel(dayId)} driver plan`);
  if (plan.isExample) lines.push("(Example data — not a real family's week)");
  lines.push("");

  if (!day || (!day.obligations.length && !day.unassigned.length)) {
    lines.push("Nothing is scheduled on this day.");
    return lines.join("\n");
  }

  const byCaregiver = new Map();
  for (const trip of day.obligations) {
    if (!byCaregiver.has(trip.caregiverId)) byCaregiver.set(trip.caregiverId, []);
    byCaregiver.get(trip.caregiverId).push(trip);
  }
  const ordered = (plan.caregivers || []).filter(caregiver => byCaregiver.has(caregiver.id));
  for (const caregiver of ordered) {
    lines.push(`${caregiver.name}:`);
    const trips = [...byCaregiver.get(caregiver.id)].sort((a, b) => a.from - b.from || a.to - b.to);
    for (const trip of trips) {
      const place = venueName(plan, trip.venueId);
      if (trip.role === "stay") {
        lines.push(`  ${formatTime(trip.from)}–${formatTime(trip.to)}  Stay with ${childName(plan, trip.childId)} at ${place} (${trip.activityName})`);
      } else {
        const verb = trip.role === "dropoff" ? "Drop off" : "Pick up";
        lines.push(`  ${formatTime(trip.from)}  ${verb} ${childName(plan, trip.childId)} at ${place} (${trip.activityName})`);
      }
    }
    lines.push("");
  }

  if (day.unassigned.length) {
    lines.push("Nobody assigned yet:");
    for (const trip of [...day.unassigned].sort((a, b) => a.from - b.from)) {
      const verb = trip.role === "dropoff" ? "Drop off" : trip.role === "pickup" ? "Pick up" : "Stay with";
      lines.push(`  ${formatTime(trip.from)}  ${verb} ${childName(plan, trip.childId)} at ${venueName(plan, trip.venueId)} (${trip.activityName})`);
    }
    lines.push("");
  }

  if (day.conflicts.length) {
    lines.push(`Conflicts to sort out (${day.conflicts.length}):`);
    for (const conflict of day.conflicts) {
      lines.push(`  - ${conflictTitle(plan, conflict)}: ${explainConflict(plan, conflict)}`);
      if (conflict.estimated) lines.push("    (Uses an estimated travel time, not a measured one.)");
    }
    lines.push("");
  } else {
    lines.push("No transport conflicts found for this day.");
    lines.push("");
  }

  const estimatedToday = analysis.estimatedRoutes.length > 0;
  if (estimatedToday) {
    lines.push("Note: some travel times are estimates you have not confirmed. This plan does not use live traffic or maps.");
  }
  lines.push("Made with AfterSchool Together. Based on this family’s times—please confirm each ride with the person helping.");
  return lines.join("\n");
}

}

// Masthead, notices, day picker
// ---------------------------------------------------------------------------

function masthead() {
  return `<header class="masthead">
    <div class="masthead-inner">
      <div class="wordmark">
        <span class="wordmark-mark" style="color:#fff">${icon("calendar")}</span>
        <div>
          <h1>AfterSchool Together</h1>
          <p>Two places at once? Let’s work out the rides.</p>
        </div>
      </div>
      <p class="masthead-note">${icon("lock")}<span>Your family plan stays in this browser. No account or automatic sharing. Save a backup when you want to keep a copy or send it yourself.</span></p>
    </div>
  </header>`;
}

function noticesHtml() {
  const blocks = [];
  if (view.plan.isExample) {
    blocks.push(`<div class="banner is-example">
      <span class="banner-tag">${icon("info")} Example week</span>
      <p><strong>This is a made-up week</strong> for Ada, Milo and Nia. Try changing a ride to see what happens, or start fresh with your own family.</p>
      <div class="banner-actions"><button class="btn btn-quiet btn-small" ${act("clear-all")}>Start our plan</button></div>
    </div>`);
  }
  for (const notice of view.notices) {
    blocks.push(`<div class="banner ${notice.tone === "alert" ? "is-alert" : ""}">
      <span class="banner-tag">${icon(notice.tone === "alert" ? "alert" : "info")} ${esc(notice.tag)}</span>
      <p>${esc(notice.message)}</p>
      <div class="banner-actions"><button class="btn btn-quiet btn-small" ${act("dismiss-notice", notice.id)}>Got it</button></div>
    </div>`);
  }
  return blocks.join("");
}

function daybar() {
  const chips = DAYS.map(day => {
    const data = view.analysis.byDay[day.id];
    const count = data.activities.length;
    const trouble = data.conflicts.length;
    const selected = day.id === view.dayId;
    const detail = trouble
      ? `<span class="chip-flag">${icon("alert")} ${trouble}</span>`
      : `<small>${count ? `${count} ${count === 1 ? "activity" : "activities"}` : "Free"}</small>`;
    const label = `${day.label}: ${count ? `${count} ${count === 1 ? "activity" : "activities"}` : "nothing scheduled"}${trouble ? `, ${trouble} ${trouble === 1 ? "conflict" : "conflicts"}` : ""}`;
    return `<button class="day-chip" ${act("select-day", day.id)} aria-pressed="${selected}" aria-label="${esc(label)}">
      <span>${day.short}</span>${detail}
    </button>`;
  }).join("");
  return `<section class="daybar" aria-label="Choose a day">
    <p class="daybar-label">Week at a glance</p>
    <div class="daybar-list">${chips}</div>
  </section>`;
}

// ---------------------------------------------------------------------------
// Agenda
// ---------------------------------------------------------------------------

function tripPill(trip, role) {
  if (!trip) return "";
  const open = !trip.caregiverId;
  const who = open ? "Nobody yet" : caregiverName(view.plan, trip.caregiverId);
  if (role === "stay") {
    return `<span class="trip-pill is-stay">${icon("clock")}<span>An adult stays: <b>${esc(who)}</b></span></span>`;
  }
  const label = role === "dropoff" ? "Drop-off" : "Pickup";
  return `<span class="trip-pill ${open ? "is-open" : ""}">${icon(role === "dropoff" ? "car" : "hand")}<span>${label}: <b>${esc(who)}</b></span></span>`;
}

function agendaItem(activity) {
  const child = findById(view.plan.children, activity.childId);
  const marker = childColor(child);
  const trips = view.analysis.obligations
    .concat(view.analysis.unassigned)
    .filter(item => item.activityId === activity.id);
  const stay = trips.find(item => item.role === "stay");
  const dropoff = trips.find(item => item.role === "dropoff");
  const pickup = trips.find(item => item.role === "pickup");
  const troubles = view.analysis.conflicts.filter(
    conflict =>
      conflict.first?.activityId === activity.id || conflict.second?.activityId === activity.id ||
      conflict.first?.id === activity.id || conflict.second?.id === activity.id,
  );
  const openTrips = trips.filter(item => !item.caregiverId);

  return `<article class="agenda-item ${troubles.length ? "has-conflict" : ""}" ${childStyle(child)}>
    <div class="agenda-top">
      <span class="child-tag"><span class="marker" aria-hidden="true">${marker.shape}</span>${esc(childName(view.plan, activity.childId))}</span>
      <span class="agenda-time">${formatTime(activity.startMinutes)} – ${formatTime(activity.endMinutes)}</span>
    </div>
    <h3>${esc(activity.name)}</h3>
    <p class="agenda-where">${esc(venueName(view.plan, activity.venueId))} · ${formatMinutes(activity.endMinutes - activity.startMinutes)}</p>
    <div class="trip-row">
      ${stay ? tripPill(stay, "stay") : tripPill(dropoff, "dropoff")}
      ${pickup ? tripPill(pickup, "pickup") : ""}
    </div>
    ${openTrips.length ? `<p class="agenda-flag">${icon("alert")}<span>${openTrips.length === 1 ? "One trip has" : `${openTrips.length} trips have`} nobody assigned yet.</span></p>` : ""}
    ${troubles.length ? `<p class="agenda-flag">${icon("alert")}<span>${troubles.length === 1 ? "In one conflict" : `In ${troubles.length} conflicts`} below.</span></p>` : ""}
    <div class="agenda-actions">
      <button class="btn btn-quiet btn-small" ${act("edit-activity", activity.id)}>${icon("pencil")} Edit</button>
      <button class="btn btn-plain" ${act("ask-delete-activity", activity.id)}>Remove</button>
    </div>
  </article>`;
}

function agendaPanel() {
  const day = view.analysis.byDay[view.dayId];
  const items = [...day.activities].sort((a, b) => a.startMinutes - b.startMinutes || a.endMinutes - b.endMinutes);
  const hasPeople = view.plan.children.length > 0;
  const anythingAtAll = view.plan.activities.length > 0;

  let body;
  if (items.length) {
    body = `<div class="agenda">${items.map(agendaItem).join("")}</div>`;
  } else if (anythingAtAll) {
    body = `<div class="empty-note">
      <h3>Nothing on ${esc(dayLabel(view.dayId))}</h3>
      <p>A free afternoon counts too. Children need unstructured time as much as scheduled time.</p>
      <div class="empty-actions"><button class="btn btn-primary btn-small" ${act("add-activity")}>${icon("plus")} Add an activity</button></div>
    </div>`;
  } else {
    body = `<div class="empty-note">
      <h3>Your week is empty</h3>
      <p>${hasPeople ? "Add the first activity and we can see whether the drop-offs and pickups fit." : "Start with your kids, the people who can help, and the places you go. Then add the after-school activities."}</p>
      <div class="empty-actions">
        <button class="btn btn-primary btn-small" ${act("add-activity")}>${icon("plus")} Add an activity</button>
        <button class="btn btn-quiet btn-small" ${act("open-setup")}>Set up people and places</button>
        <button class="btn btn-quiet btn-small" ${act("load-example")}>Show the example week</button>
      </div>
    </div>`;
  }

  return `<section class="panel" aria-labelledby="agenda-heading">
    <div class="panel-head">
      <div>
        <h2 id="agenda-heading">${esc(dayLabel(view.dayId))}</h2>
        <p>${items.length ? `${items.length} ${items.length === 1 ? "activity" : "activities"} · ${day.obligations.length + day.unassigned.length} trips` : "Nothing scheduled"}</p>
      </div>
      <button class="btn btn-primary btn-small" ${act("add-activity")}>${icon("plus")} Add an activity</button>
    </div>
    ${body}
  </section>`;
}

// ---------------------------------------------------------------------------
// Conflicts and next actions
// ---------------------------------------------------------------------------

function suggestionButtons(conflict) {
  const suggestions = suggestAlternateDrivers(view.plan, conflict);
  const seen = new Set();
  const buttons = [];
  for (const suggestion of suggestions) {
    const key = `${suggestion.trip.key}|${suggestion.caregiverId}`;
    if (seen.has(key)) continue;
    seen.add(key);
    buttons.push(`<button class="btn btn-quiet btn-small" data-act="apply-suggestion" data-conflict="${esc(conflict.id)}" data-trip="${esc(suggestion.trip.key)}" data-caregiver="${esc(suggestion.caregiverId)}" data-fk="apply-suggestion:${esc(key)}">
      Ask ${esc(caregiverName(view.plan, suggestion.caregiverId))} to ${esc(handoverPhrase(view.plan, suggestion.trip))}
    </button>`);
  }
  const editButtons = [conflict.first, conflict.second]
    .map(item => item.activityId || item.id)
    .filter((id, index, list) => id && list.indexOf(id) === index)
    .map(id => {
      const activity = findById(view.plan.activities, id);
      return `<button class="btn btn-quiet btn-small" ${act("edit-activity", id)}>Change the times for ${esc(activity ? activity.name : "this activity")}</button>`;
    });

  return `<div class="choices">
    <p class="choices-label">Ways to make it work</p>
    <div class="choices-list">${editButtons.join("")}${buttons.join("")}</div>
    ${conflict.kind === "driver" && !buttons.length ? `<p class="choices-none">No one else on your list has enough time for this ride. Try another class time or make a different plan for the afternoon.</p>` : ""}
    ${buttons.length ? `<p class="choices-none">Check with them first. Choosing a driver here changes your plan, but does not send a message or confirm a ride.</p>` : ""}
  </div>`;
}

function conflictCard(conflict) {
  return `<article class="conflict-card ${conflict.kind === "driver" ? "" : "is-child"}">
    <div class="conflict-head">
      ${icon("alert")}
      <div>
        <h3>${esc(conflictTitle(view.plan, conflict))}</h3>
        <p class="conflict-day">${esc(dayLabel(conflict.dayId))}</p>
      </div>
    </div>
    <p class="conflict-why">${esc(explainConflict(view.plan, conflict))}</p>
    ${conflict.estimated ? `<p class="conflict-estimate">${icon("info")}<span>This uses an <strong>estimated</strong> ${formatMinutes(conflict.travelMinutes)} between those two places because you have not entered a real travel time. It is not a live route and does not know about traffic.</span></p>` : ""}
    ${suggestionButtons(conflict)}
  </article>`;
}

function decisionsPanel() {
  const day = view.analysis.byDay[view.dayId];
  const counts = view.analysis.counts;
  const elsewhere = DAYS.filter(item => item.id !== view.dayId && view.analysis.byDay[item.id].conflicts.length);

  const tally = `<div class="tally">
    <div class="tally-item ${day.conflicts.length ? "is-alert" : "is-clear"}"><b>${day.conflicts.length}</b><span>${day.conflicts.length === 1 ? "conflict" : "conflicts"} on ${esc(dayLabel(view.dayId).slice(0, 3))}</span></div>
    <div class="tally-item ${counts.conflicts ? "is-alert" : "is-clear"}"><b>${counts.conflicts}</b><span>this week</span></div>
    <div class="tally-item ${counts.unassigned ? "is-caution" : ""}"><b>${counts.unassigned}</b><span>${counts.unassigned === 1 ? "trip with no driver" : "trips with no driver"}</span></div>
    <div class="tally-item ${counts.estimatedRoutes ? "is-caution" : ""}"><b>${counts.estimatedRoutes}</b><span>${counts.estimatedRoutes === 1 ? "estimated travel time" : "estimated travel times"}</span></div>
  </div>`;

  let body;
  if (day.conflicts.length) {
    body = day.conflicts.map(conflictCard).join("");
  } else if (day.activities.length) {
    body = `<div class="all-clear">${icon("check")}<div>
      <h3>${esc(dayLabel(view.dayId))} works</h3>
      <p>Every trip on this day fits, using the travel times you entered and a ${formatMinutes(view.analysis.settings.bufferMinutes)} buffer at each handover.</p>
    </div></div>`;
  } else {
    body = `<div class="empty-note"><p>Nothing to check on ${esc(dayLabel(view.dayId))} yet.</p></div>`;
  }

  const openTrips = day.unassigned.length
    ? `<div class="conflict-card is-child" style="margin-top:12px">
        <div class="conflict-head">${icon("alert")}<div><h3>${day.unassigned.length} ${day.unassigned.length === 1 ? "trip has" : "trips have"} nobody assigned</h3><p class="conflict-day">${esc(dayLabel(view.dayId))}</p></div></div>
        <ul class="fineprint">${day.unassigned.map(trip => `<li>${esc(shortTripLabel(view.plan, trip))} at ${esc(venueName(view.plan, trip.venueId))} — ${esc(trip.activityName)}</li>`).join("")}</ul>
        <div class="choices"><p class="choices-label">Ways to make it work</p><div class="choices-list">${[...new Set(day.unassigned.map(trip => trip.activityId))].map(id => `<button class="btn btn-quiet btn-small" ${act("edit-activity", id)}>Assign someone for ${esc(findById(view.plan.activities, id)?.name || "this activity")}</button>`).join("")}</div></div>
      </div>`
    : "";

  const estimates = view.analysis.estimatedRoutes.length
    ? `<div class="conflict-card is-child" style="margin-top:12px">
        <div class="conflict-head">${icon("info")}<div><h3>A few drive times still need checking</h3><p class="conflict-day">Those parts of the plan are only estimates</p></div></div>
        <ul class="fineprint">${view.analysis.estimatedRoutes.map(pair => `<li>${esc(venueName(view.plan, pair.fromVenueId))} ↔ ${esc(venueName(view.plan, pair.toVenueId))} — using ${formatMinutes(pair.minutes)}</li>`).join("")}</ul>
        <div class="choices"><div class="choices-list"><button class="btn btn-quiet btn-small" ${act("open-setup")}>Add the drive times you know</button></div></div>
      </div>`
    : "";

  const other = elsewhere.length
    ? `<div class="choices" style="margin-top:14px"><p class="choices-label">Other days needing attention</p><div class="choices-list">${elsewhere.map(item => `<button class="btn btn-quiet btn-small" ${act("select-day", item.id)}>${esc(item.label)} (${view.analysis.byDay[item.id].conflicts.length})</button>`).join("")}</div></div>`
    : "";

  return `<section class="panel" aria-labelledby="decisions-heading">
    <div class="panel-head"><div><h2 id="decisions-heading">Let’s sort out the tricky bits</h2><p>Based on your drive times, not live traffic. Leave room for the school-run rush.</p></div></div>
    ${tally}
    ${body}
    ${openTrips}
    ${estimates}
    ${other}
  </section>`;
}

// ---------------------------------------------------------------------------
// Setup
// ---------------------------------------------------------------------------

function entityChips(list, kind, styled = false) {
  if (!list.length) return `<p class="choices-none">None yet.</p>`;
  return `<div class="chip-list">${list.map(item => `<span class="entity-chip" ${styled ? childStyle(item) : ""}>
    ${styled ? `<span class="marker" aria-hidden="true">${childColor(item).shape}</span>` : ""}
    <span>${esc(item.name)}</span>
    <button type="button" ${act(`remove-${kind}`, item.id)} aria-label="Remove ${esc(item.name)}">${icon("close")}</button>
  </span>`).join("")}</div>`;
}

function addForm(kind, placeholder, label) {
  return `<form class="inline-add" data-add="${kind}">
    <label class="visually-hidden" for="add-${kind}">${esc(label)}</label>
    <input type="text" id="add-${kind}" name="name" maxlength="60" placeholder="${esc(placeholder)}" data-fk="add-${kind}" />
    <button class="btn btn-quiet btn-small" type="submit">${icon("plus")} Add</button>
  </form>`;
}

function routeRows() {
  const venues = view.plan.venues;
  if (venues.length < 2) {
    return `<p class="choices-none">Add two or more places and you can enter how long it takes to get between them.</p>`;
  }
  const rows = [];
  for (let i = 0; i < venues.length; i += 1) {
    for (let j = i + 1; j < venues.length; j += 1) {
      const from = venues[i];
      const to = venues[j];
      const route = view.plan.routes.find(
        item =>
          (item.fromVenueId === from.id && item.toVenueId === to.id) ||
          (item.fromVenueId === to.id && item.toVenueId === from.id),
      );
      const known = route && parseMinutesInput(route.minutes) !== null;
      rows.push(`<tr>
        <td>${esc(from.name)} <span aria-hidden="true">↔</span> ${esc(to.name)}<br /><span class="${known ? "route-known" : "route-estimated"}">${known ? "Your time" : `Estimated ${formatMinutes(view.analysis.settings.defaultTravelMinutes)}`}</span></td>
        <td><label class="visually-hidden" for="route-${from.id}-${to.id}">Minutes from ${esc(from.name)} to ${esc(to.name)}</label>
        <input type="number" min="0" step="1" inputmode="numeric" id="route-${from.id}-${to.id}" data-route-from="${esc(from.id)}" data-route-to="${esc(to.id)}" data-fk="route:${esc(from.id)}:${esc(to.id)}" value="${known ? route.minutes : ""}" placeholder="—" /></td>
      </tr>`);
    }
  }
  return `<table class="route-table"><caption class="visually-hidden">Travel time between each pair of places, in minutes</caption>
    <thead><tr><th scope="col">Between</th><th scope="col">Minutes</th></tr></thead>
    <tbody>${rows.join("")}</tbody></table>`;
}

function setupSection() {
  const toggle = `<button class="section-toggle" ${act("toggle-setup")} aria-expanded="${view.setupOpen}" aria-controls="setup-body">
    <div><h2>People, places and travel times</h2><p>Add your usual drive times so the plan can spot a tight pickup.</p></div>
    <span class="chev">${icon("chevron")}</span>
  </button>`;
  if (!view.setupOpen) return toggle;

  return `${toggle}
  <div class="panel setup-body" id="setup-body">
    <div class="setup-grid">
      <div class="setup-block">
        <h3>${icon("people")} Children</h3>
        <p>Nicknames are all we need. Keep birthdays, school names and contact details out of the plan.</p>
        ${entityChips(view.plan.children, "child", true)}
        ${addForm("child", "Nickname", "Add a child")}
      </div>
      <div class="setup-block">
        <h3>${icon("car")} Who helps out</h3>
        <p>A partner, grandparent or trusted friend who can drive or stay. First names or nicknames are enough.</p>
        ${entityChips(view.plan.caregivers, "caregiver")}
        ${addForm("caregiver", "Name", "Add someone who helps")}
      </div>
      <div class="setup-block">
        <h3>${icon("pin")} Places</h3>
        <p>Nicknames, not addresses. “Little Gym” is more useful than a street.</p>
        ${entityChips(view.plan.venues, "venue")}
        ${addForm("venue", "Place nickname", "Add a place")}
      </div>
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:20px 0" />
    <div class="setup-grid">
      <div class="setup-block">
        <h3>Travel times</h3>
        <p>Know the drive from piano to the pool? Add it here. Any drive you leave blank will be clearly marked as an estimate.</p>
        ${routeRows()}
      </div>
      <div class="setup-block">
        <h3>A little breathing room</h3>
        <p>Allow time to park, walk in and say goodbye—not just time behind the wheel.</p>
        <div class="settings-row">
          <label class="field"><span>Extra minutes at each stop<small>Parking, walking in, saying goodbye.</small></span>
            <input type="number" min="0" step="1" inputmode="numeric" data-setting="bufferMinutes" data-fk="setting:bufferMinutes" value="${esc(view.plan.settings.bufferMinutes)}" /></label>
          <label class="field"><span>Drive time when you are unsure<small>Used only where you have not entered a time.</small></span>
            <input type="number" min="0" step="1" inputmode="numeric" data-setting="defaultTravelMinutes" data-fk="setting:defaultTravelMinutes" value="${esc(view.plan.settings.defaultTravelMinutes)}" /></label>
        </div>
      </div>
    </div>
  </div>`;
}

// ---------------------------------------------------------------------------
// Dialogs

function optionList(items, selected, placeholder) {
  return `<option value="">${esc(placeholder)}</option>${items
    .map(item => `<option value="${esc(item.id)}" ${item.id === selected ? "selected" : ""}>${esc(item.name)}</option>`)
    .join("")}`;
}

      <button type="button" class="dialog-close" ${act("close-dialog")} aria-label="Close without saving">${icon("close")}</button>
